<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery - Fantastic Hotel</title>
<link rel="stylesheet" href="dusenge.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>



/* PAGE FADE IN */
body {
    animation: fadePage 1s ease-in;
}

@keyframes fadePage {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* TITLE ANIMATION */
.title h2 {
    font-size: 60px;
    color: #3a1c8c;
    animation: slideDown 1s ease-out;
}

@keyframes slideDown {
    from {
        transform: translateY(-40px);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

/* GALLERY IMAGE ANIMATION */
.gallery img {
    width: 100%;
    height: 250px;
    object-fit: cover;
    cursor: pointer;
    transition: 0.4s ease;
    animation: zoomIn 0.8s ease forwards;
}

.gallery img:hover {
    transform: scale(1.08) rotate(1deg);
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

@keyframes zoomIn {
    from {
        transform: scale(0.8);
        opacity: 0;
    }
    to {
        transform: scale(1);
        opacity: 1;
    }
}

/* MODAL ANIMATION */
.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    padding-top: 50px;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    animation: fadeModal 0.3s ease;
}

@keyframes fadeModal {
    from { opacity: 0; }
    to { opacity: 1; }
}

.modal img {
    margin: auto;
    display: block;
    width: 80%;
    max-width: 700px;
    animation: pop 0.3s ease;
}

@keyframes pop {
    from {
        transform: scale(0.6);
        opacity: 0;
    }
    to {
        transform: scale(1);
        opacity: 1;
    }
}

/* BUTTON ANIMATION */
button {
    transition: all 0.3s ease;
}

button:hover {
    transform: translateY(-3px);
    background: #2b1bb3;
    color: white;
}


</style>
</head>

<body>

<header>
    <h1>FANTASTIC <span style="color:orange;"">HOTEL MANAGEMENT SYSTEM</span></h1>
    <nav>
        <a href="Home.html">Home</a>
        <a href="About.html">About</a>
        <a href="Rooms.html">Rooms</a>
        <a href="Gallery.html">Gallery</a>
        <a href="Contact.html">Contact</a>
        <a href="Reservation.html">Reservation</a>
    </nav>
</header>
<div class="title">
    <h2>Our Gallery</h2>
</div>

<!-- GALLERY -->
<div class="gallery">
    <img src="ooo.png" onclick="openModal(this)">
    <img src="xxx.png" onclick="openModal(this)">
    <img src="ggg.png" onclick="openModal(this)">
    <img src="fff.png" onclick="openModal(this)">
    <img src="ttt.png" onclick="openModal(this)">
    <img src="bbb.png" onclick="openModal(this)">
     <img src="vvv.png" onclick="openModal(this)">
     <img src="eee.png.png" onclick="openModal(this)">e
</div>

<!-- MODAL -->
<div id="myModal" class="modal">
    <span class="close" onclick="closeModal()">&times;</span>
    <img id="modalImg">
</div>
<script>
// close </scripmodal when clicking outside image
window.onclick = function(event) {
    let modal = document.getElementById("myModal");
    if (event.target == modal) {
        modal.style.display = "none";
    }
}
</script>

<div class="footer">
    
    <button>Kinyarwanda</button>
        <button>English</button>
        <button>French</button>
        <button>Swahili</button>
        <p style="color: orange;"> &copy; FANTASTIC Hotel.All right Reserved</p>

    </div>
</body>
</html>
