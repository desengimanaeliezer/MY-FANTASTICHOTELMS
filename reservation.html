/* TITLE */

     margin-top: 10px;

/* CONTAINER */
.container {

/* BOX */
.box {
    width: 350px;
    background: rgb(196, 250, 2);

     cursor: pointer;

s    color: aliceblue;

        <label>Title</label>

            <option>Mr</option>

    <!-- RESERVATION -->

</div>
<centet>

<!-- PAYMENT -->
<div class="payment">
    <label for="payment">Payment Mode</label>
    <select id="payment">
        <option value="">--Select Payment--</option>
        <option>Phone number</option>
        <option>Code</option>
        <option>Banks</option>
    </select>
</div>
</centet>

<!-- BUTTON -->
<div style="text-align:center;">
    <button onclick="submitForm()">SUBMIT</button>
</div>
</center>
<script>
function submitForm() {

    // PERSONAL INFO
    let firstName = document.querySelector("input[type='text']").value;
    let lastName = document.querySelectorAll("input[type='text']")[1].value;
    let email = document.querySelector("input[type='email']").value;
    let phone = document.querySelector("input[type='number']").value;

    // RESERVATION INFO
    let roomType = document.querySelectorAll("select")[1].value;
    let bedding = document.querySelectorAll("select")[2].value;
    let rooms = document.querySelector("input[type='number'][min='1']").value;
    let meal = document.querySelectorAll("select")[3].value;
    let checkin = document.querySelectorAll("input[type='date']")[0].value;
    let checkout = document.querySelectorAll("input[type='date']")[1].value;

    // PAYMENT
    let payment = document.getElementById("payment").value;

    // VALIDATION
    if (
        firstName === "" ||
        lastName === "" ||
        email === "" ||
        phone === "" ||
        roomType === "" ||
        bedding === "" ||
        rooms === "" ||
        meal === "" ||
        checkin === "" ||
        checkout === "" ||
        payment === ""
    ) {
        alert("❌ Please fill all fields before submitting!");
        return;
    }

    // DATE CHECK
    if (checkout <= checkin) {
        alert("❌ Check-out must be after check-in!");
        return;
    }

    // SUCCESS
    alert("✅ Reservation submitted successfully!");

    // RESET FORM
    let inputs = document.querySelectorAll("input, select");
    inputs.forEach(el => el.value = "");
}
</script>
